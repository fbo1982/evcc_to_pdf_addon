name: "EVCC to PDF"
description: "Modulare Energieabrechnung aus EVCC und Home Assistant mit PDF und E-Mail-Versand"
version: "1.3.03"
slug: "evcc_to_pdf"
url: "https://github.com/fbo1982/evcc_to_pdf_addon"
startup: application
boot: auto
timeout: 20

arch:
  - amd64
  - aarch64

ingress: true
ingress_port: 8099
homeassistant_api: true
panel_title: "EVCC to PDF"
panel_icon: "mdi:home-lightning-bolt-outline"

map:
  # Read-only compatibility mount: allows v1.3.03 to migrate settings created by
  # v1.3.02 and older from /config into the persistent /data/evcc_to_pdf store.
  - type: app_config
    read_only: true
    path: /config
  - type: share
    read_only: false

options:
  mqtt_host: "core-mosquitto"
  mqtt_port: 1883
  mqtt_user: ""
  mqtt_password: ""
  mqtt_base_topic: "/evcc2pdf"

schema:
  mqtt_host: str
  mqtt_port: port
  mqtt_user: str?
  mqtt_password: password?
  mqtt_base_topic: str
